[project]
name = "mediateca-madrid"
version = "0.1.3"
description = "Portal alternativo de busqueda de videos, DVD y Blu-ray de las bibliotecas publicas de Madrid"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Mediateca Madrid" }]
dependencies = [
  "mediateca-shared==0.2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "meilisearch>=0.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediateca"]

[tool.hatch.build.targets.sdist]
include = ["src/mediateca", "tests", "README.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
